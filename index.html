<style>

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1120;--surface:#111827;--surface2:#1e293b;--text:#e5e7eb;--muted:#94a3b8;--border:#263244;--primary:#60a5fa;--primary-ink:#0b1120;--primary-soft:#172b4d;--danger:#f87171;--danger-soft:#3b1a1d;--warn:#fbbf24;--warn-soft:#3a2d10;--ok:#34d399;--ok-soft:#0c3329;--mark:#a16207;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1120;--surface:#111827;--surface2:#1e293b;--text:#e5e7eb;--muted:#94a3b8;--border:#263244;--primary:#60a5fa;--primary-ink:#0b1120;--primary-soft:#172b4d;--danger:#f87171;--danger-soft:#3b1a1d;--warn:#fbbf24;--warn-soft:#3a2d10;--ok:#34d399;--ok-soft:#0c3329;--mark:#a16207;--shadow:0 6px 20px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
.ic{width:18px;height:18px;flex:none}
.ic.big{width:40px;height:40px;opacity:.45}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding-top:env(safe-area-inset-top)}
.bar,.searchrow{max-width:960px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:8px}
.searchrow{padding-top:2px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;min-width:0}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .ic{color:var(--primary)}
.spacer{flex:1}
.icon-btn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:0;background:transparent;cursor:pointer;color:var(--text);flex:none}
.icon-btn:hover{background:var(--surface2)}
.icon-btn.danger{color:var(--danger)}
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.searchbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:0 4px 0 12px;height:44px}
.searchbox:focus-within{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.searchbox input{flex:1;border:0;outline:0;background:transparent;height:100%;min-width:0;font-size:16px}
.searchbox>.ic{color:var(--muted)}
input[type=search]::-webkit-search-cancel-button{display:none}
main{max-width:960px;margin:0 auto;padding:16px 16px calc(48px + env(safe-area-inset-bottom))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--danger)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{height:34px;padding:0 10px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.6;cursor:default}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 14px}
h1{font-size:22px;margin:0;line-height:1.25;word-break:break-word}
h2{font-size:17px;margin:0}
.count{color:var(--muted);font-weight:500;font-size:.75em;margin-left:4px}
.muted{color:var(--muted)}
.small{font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.mcard:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cover{aspect-ratio:16/10;background:var(--surface2);display:grid;place-items:center;color:var(--muted)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.mbody{padding:12px 14px}
.mtitle{font-weight:700;font-size:16px;word-break:break-word}
.stats{display:flex;gap:12px;margin-top:6px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.stats span{display:inline-flex;align-items:center;gap:4px}
.stats .ic{width:15px;height:15px}
@media (max-width:520px){.grid{grid-template-columns:1fr 1fr;gap:10px}.mbody{padding:10px}.mtitle{font-size:15px}}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumbs a:hover{color:var(--primary)}
.hero{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.hero-main{min-width:0;flex:1}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--primary);margin-bottom:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;background:var(--surface2);font-size:13px;color:var(--muted)}
.chip .ic{width:14px;height:14px}
a.chip:hover{color:var(--primary)}
.desc{margin:10px 0 0;white-space:pre-wrap;word-break:break-word}
.hero-actions{display:flex;gap:2px;flex:none}
.tabs{display:flex;gap:2px;overflow-x:auto;margin:14px 0;scrollbar-width:none;border-bottom:1px solid var(--border)}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:10px 12px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:center}
.tab.on{color:var(--primary);border-bottom-color:var(--primary)}
.tab .n{font-size:12px;background:var(--surface2);border-radius:999px;padding:0 7px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.row:hover{border-color:var(--primary)}
.row>.ic{color:var(--muted)}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;overflow:hidden;flex:none;color:var(--muted)}
.thumb img{width:100%;height:100%;object-fit:cover}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap;word-break:break-word}
.clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--primary-soft);color:var(--primary);white-space:nowrap}
.kind-alarm .code{background:var(--danger-soft);color:var(--danger)}
.kind-pallet .code{background:var(--ok-soft);color:var(--ok)}
.prog-code{background:var(--warn-soft);color:var(--warn)}
.entry{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;scroll-margin:140px}
.entry.flash{animation:flash 1.8s ease}
@keyframes flash{0%,45%{box-shadow:0 0 0 3px var(--primary)}100%{box-shadow:0 0 0 0 transparent}}
.entry-head{width:100%;display:flex;align-items:center;gap:10px;padding:12px 14px;border:0;background:transparent;text-align:left;cursor:pointer}
.entry-title{flex:1;font-weight:600;min-width:0;word-break:break-word}
.entry-meta{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:13px;flex:none}
.entry-meta .ic{width:15px;height:15px}
.chev{transition:transform .2s}
.entry.open .chev{transform:rotate(90deg)}
.entry-snippet{padding:0 14px 12px;color:var(--muted);font-size:14px;margin-top:-6px}
.entry-body{padding:0 14px 14px}
.content{white-space:pre-wrap;word-break:break-word;line-height:1.65}
.entry-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding-top:10px;border-top:1px solid var(--border)}
.actions{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:10px}
.gallery:empty{display:none}
.gallery.big{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:0}
@media (max-width:520px){.gallery.big{grid-template-columns:repeat(3,1fr);gap:4px}}
.gimg{padding:0;border:0;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface2);cursor:zoom-in}
.gimg img{width:100%;height:100%;object-fit:cover;display:block}
.empty{text-align:center;padding:36px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius)}
.empty p{margin:8px 0 0}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{border:1px solid var(--border);background:var(--surface);padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--muted)}
.fchip.on{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.result{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}
.result:hover{border-color:var(--primary)}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;flex:none;background:var(--surface2);color:var(--muted);margin-top:2px}
.b-machine{background:var(--primary-soft);color:var(--primary)}
.b-alarm{background:var(--danger-soft);color:var(--danger)}
.b-pallet{background:var(--ok-soft);color:var(--ok)}
.b-program{background:var(--warn-soft);color:var(--warn)}
.r-main{flex:1;min-width:0}
.r-title{font-weight:600;word-break:break-word}
.crumb{font-size:12px;color:var(--muted)}
.r-snip{font-size:14px;color:var(--muted);margin-top:4px;word-break:break-word}
.result .thumb{width:48px;height:48px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.overlay{position:fixed;inset:0;background:rgba(2,6,23,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .15s}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:560px;max-height:calc(100dvh - 32px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.sm{max-width:380px}
@media(max-width:600px){.overlay{align-items:flex-end;padding:0}.modal,.modal.sm{border-radius:18px 18px 0 0;max-height:94dvh;max-width:none}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 12px 12px 16px;border-bottom:1px solid var(--border)}
.modal-body{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.modal-foot{display:flex;align-items:center;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border)}
.modal-foot .progress{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field textarea{border:1px solid var(--border);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px;outline:0;width:100%}
.field textarea{min-height:150px;resize:vertical;line-height:1.55}
.field input:focus,.field textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.req{color:var(--danger)}
.imgmgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px}
.imgmgr:empty{display:none}
.imi{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--surface2)}
.imi img{width:100%;height:100%;object-fit:cover;display:block}
.imi.new::after{content:'NEW';position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:700;background:var(--primary);color:var(--primary-ink);padding:1px 5px;border-radius:4px}
.imi button{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.imi button .ic{width:14px;height:14px}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-list .btn{justify-content:flex-start;height:46px}
.lb{position:fixed;inset:0;background:#000;z-index:60;display:flex;flex-direction:column;color:#fff;animation:fade .15s}
.lb-top{display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 8px 8px 16px;font-weight:600}
.lb-top .icon-btn{color:#fff}
.lb-top .icon-btn:hover{background:rgba(255,255,255,.14)}
.lb-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;padding-bottom:env(safe-area-inset-bottom)}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;display:grid;place-items:center}
.lb-prev{left:12px}.lb-next{right:12px}
@media(max-width:600px){.lb-nav{display:none}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#toast.error{background:var(--danger);color:#fff}
.auth{min-height:100dvh;display:grid;place-items:center;padding:20px}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.auth-top{display:flex;justify-content:space-between;align-items:center}
.auth-logo{width:52px;height:52px;border-radius:16px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center}
.auth-logo .ic{width:28px;height:28px}
.brand-logo{width:26px;height:26px;border-radius:7px;flex:none;display:block}
.auth-logo.img{background:none;overflow:hidden}
.auth-logo.img img{width:100%;height:100%;display:block}
.install-btn{color:var(--primary)}
.ios-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px}
.ios-steps li{line-height:1.5}
.ios-steps .ic{width:18px;height:18px;vertical-align:-3px;color:var(--primary)}
.install-hero{display:flex;gap:12px;align-items:center}
.install-hero img{width:56px;height:56px;border-radius:14px}
.linkbtn{border:0;background:none;color:var(--primary);cursor:pointer;padding:0;font-size:13px;text-align:left}
.errbox{background:var(--danger-soft);color:var(--danger);padding:10px 12px;border-radius:10px;font-size:14px}
.loading{display:grid;place-items:center;gap:12px;padding:60px;color:var(--muted)}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0}}
</style>
</head>

/* ---------------- Boot / Auth ---------------- */
function getConfig() {
  if (CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY) return { url: CONFIG.SUPABASE_URL.trim(), key: CONFIG.SUPABASE_ANON_KEY.trim(), fixed: true };
  const c = LS.get('mct_cfg', null);
  return c && c.url && c.key ? c : null;
}
async function boot() {
  applyTheme();
  document.documentElement.lang = lang; document.title = t('appName');
  const cfg = getConfig();
  if (!cfg) { screen = 'setup'; return renderSetup(); }
  try {
    sb = window.supabase.createClient(cfg.url, cfg.key);
  } catch (err) { screen = 'setup'; return renderSetup(err.message); }
  sb.auth.onAuthStateChange(ev => {
    if (ev === 'SIGNED_OUT') { S.loaded = false; S.user = null; screen = 'login'; closeModal(); renderLogin(); }
  });
  let session = null;
  try { session = (await sb.auth.getSession()).data.session; } catch {}
  if (!session) { screen = 'login'; return renderLogin(); }
  startApp(session);
}
function startApp(session) {
  S.user = session.user; screen = 'app';
  renderShell(); loadAll();
}
function rerender() {
  if (screen === 'setup') renderSetup();
  else if (screen === 'login') renderLogin();

}

function renderLogin() {
  const cfg = getConfig();
  $('#app').innerHTML = `<div class="auth"><form class="auth-card" id="loginForm">
    <div class="auth-top"><div class="auth-logo img"><img src="icons/icon-192.png" alt=""></div><div class="actions">${langSeg()}${themeBtn()}</div></div>

/* ---------------- Data ---------------- */
async function fetchAll(table) {
  let all = [], from = 0; const size = 1000;
  for (;;) {
    const { data, error } = await sb.from(table).select('*').order('created_at', { ascending: true }).range(from, from + size - 1);
    if (error) throw error;
    all = all.concat(data);
    if (data.length < size) break;
    from += size;
  }
  return all.map(fixRow);
}
async function loadAll() {
  S.loaded = false; S.loadError = null; render();
  try {
    const [m, p, e] = await Promise.all([fetchAll('machines'), fetchAll('programs'), fetchAll('entries')]);
    S.machines = m; S.programs = p; S.entries = e; S.loaded = true;
  } catch (err) { S.loadError = err.message || String(err); }
  render();
}

/* ---------------- Gambar ---------------- */
function pickFiles(camera) {
  return new Promise(res => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*';
    if (camera) inp.setAttribute('capture', 'environment'); else inp.multiple = true;
    inp.style.display = 'none';
    document.body.appendChild(inp);
    let done = false;
    const finish = files => { if (done) return; done = true; res(files); setTimeout(() => inp.remove(), 0); };
    inp.addEventListener('change', () => finish([...inp.files]));
    inp.addEventListener('cancel', () => finish([]));
    inp.click();
  });
}
function loadImageEl(file) {
  return new Promise((res, rej) => {
    const u = URL.createObjectURL(file); const im = new Image();
    im.onload = () => { res(im); setTimeout(() => URL.revokeObjectURL(u), 2000); };
    im.onerror = () => { URL.revokeObjectURL(u); rej(new Error('image')); };
    im.src = u;
  });
}
async function compress(file, max = 1600, q = 0.82) {
  try {
    let src;
    try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); } catch { src = await loadImageEl(file); }
    const w = src.width || src.naturalWidth, h = src.height || src.naturalHeight;
    const s = Math.min(1, max / Math.max(w, h));
    const c = document.createElement('canvas');
    c.width = Math.round(w * s); c.height = Math.round(h * s);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/jpeg', q));
    return blob && blob.size < file.size ? blob : (blob || file);
  } catch { return file; }
}
async function uploadFiles(table, id, files, onProgress) {
  const out = [];
  try {
    for (let i = 0; i < files.length; i++) {
      onProgress && onProgress(i + 1, files.length);
      const blob = await compress(files[i]);
      const type = blob.type || 'image/jpeg';
      const ext = (type.split('/')[1] || 'jpg').replace('jpeg', 'jpg');
      const path = `${table}/${id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
      const { error } = await sb.storage.from(BUCKET).upload(path, blob, { contentType: type, cacheControl: '31536000', upsert: false });
      if (error) throw error;
      out.push({ path });
    }
  } catch (err) { removePaths(out.map(x => x.path)); throw err; }
  return out;
}
async function removePaths(paths) {
  paths = paths.filter(Boolean);
  for (let i = 0; i < paths.length; i += 100) {
    try { await sb.storage.from(BUCKET).remove(paths.slice(i, i + 100)); } catch (e) { console.warn(e); }
  }
}
async function quickAddPhotos(table, id, camera) {
  const files = await pickFiles(camera);
  if (!files.length) return;
  const row = getRow(table, id); if (!row) return;
  let uploaded = [];
  try {
    uploaded = await uploadFiles(table, id, files, (i, n) => toast(t('uploading', { i, n }), '', true));
    const images = [...row.images, ...uploaded];
    const { data, error } = await sb.from(table).update({ images, updated_at: new Date().toISOString() }).eq('id', id).select().single();
    if (error) throw error;
    replaceLocal(table, data); render({ keepScroll: true }); toast(t('saved'));
  } catch (err) {
    removePaths(uploaded.map(x => x.path));
    toast(t('error', { msg: err.message }), 'error');
  }
}
async function deletePhoto(table, id, index) {
  const row = getRow(table, id); if (!row) return;
  const img = row.images[index]; if (!img) return;
  if (!confirm(t('confirmDeletePhoto'))) return;
  const images = row.images.filter((_, i) => i !== index);
  const { data, error } = await sb.from(table).update({ images, updated_at: new Date().toISOString() }).eq('id', id).select().single();
  if (error) return toast(t('error', { msg: error.message }), 'error');
  removePaths([img.path]);
  replaceLocal(table, data); render({ keepScroll: true }); toast(t('deleted'));
  if ($('#lb')) renderLB();
}

/* ---------------- Hapus record ---------------- */
async function deleteRecord(table, id) {
  const row = getRow(table, id); if (!row) return;
  const name = table === 'programs' ? progLabel(row) : (row.name || row.title);
  if (!confirm(t('confirmDelete', { name }))) return;
  let paths = row.images.map(i => i.path);
  if (table === 'machines') {
    S.programs.filter(p => p.machine_id === id).forEach(p => paths.push(...p.images.map(i => i.path)));
    S.entries.filter(e => e.machine_id === id).forEach(e => paths.push(...e.images.map(i => i.path)));
  } else if (table === 'programs') {
    S.entries.filter(e => e.program_id === id).forEach(e => paths.push(...e.images.map(i => i.path)));
  }
  const { error } = await sb.from(table).delete().eq('id', id);
  if (error) return toast(t('error', { msg: error.message }), 'error');
  if (table === 'machines') {
    S.machines = S.machines.filter(r => r.id !== id);
    S.programs = S.programs.filter(r => r.machine_id !== id);
    S.entries = S.entries.filter(r => r.machine_id !== id);
    location.hash = '/';
  } else if (table === 'programs') {
    S.programs = S.programs.filter(r => r.id !== id);
    S.entries = S.entries.filter(r => r.program_id !== id);
    location.hash = `/m/${row.machine_id}?tab=programs`;
  } else {
    S.entries = S.entries.filter(r => r.id !== id);
    render({ keepScroll: true });
  }
  removePaths(paths);
  toast(t('deleted'));
}

const FORM_DEF = {
  machine: [{ k: 'name', l: 'name', req: 1 }, { k: 'model', l: 'model' }, { k: 'location', l: 'location' }, { k: 'description', l: 'description', area: 1 }],
  program: [{ k: 'number', l: 'programNo', ph: 'O1234' }, { k: 'name', l: 'name', req: 1 }, { k: 'description', l: 'description', area: 1 }],
  alarm: [{ k: 'code', l: 'alarmCode', ph: 'EX1234' }, { k: 'title', l: 'alarmTitle', req: 1 }, { k: 'content', l: 'alarmContent', area: 1 }],
  machine_note: [{ k: 'title', l: 'title', req: 1 }, { k: 'content', l: 'content', area: 1 }],
  pallet: [{ k: 'code', l: 'palletNo', ph: 'P1' }, { k: 'title', l: 'title', req: 1 }, { k: 'content', l: 'palletContent', area: 1 }],
  program_note: [{ k: 'title', l: 'title', req: 1 }, { k: 'content', l: 'content', area: 1 }]
};
let modalCleanup = null;
function showModal(html, onClose) {
  closeModal();
  $('#modal-root').innerHTML = html;
  document.body.classList.add('lock');
  modalCleanup = onClose || null;
}
function closeModal() {
  if (modalCleanup) { try { modalCleanup(); } catch {} modalCleanup = null; }
  $('#modal-root').innerHTML = '';
  if (!$('#lb')) document.body.classList.remove('lock');
}

function openForm(kind, row, ctx = {}) {
  const fields = FORM_DEF[kind]; if (!fields) return;
  const table = kindTable(kind), isNew = !row;
  const st = { kept: [...(row?.images || [])], removed: [], files: [] };
  const label = t('type_' + kind);
  showModal(`<div class="overlay"><form class="modal" id="frm" novalidate>
    <div class="modal-head"><h2>${esc(isNew ? t('addFmt', { x: label }) : t('editFmt', { x: label }))}</h2><button type="button" class="icon-btn" data-close aria-label="${esc(t('close'))}">${ic('x')}</button></div>
    <div class="modal-body">
      ${fields.map(f => `<div class="field"><label>${esc(t(f.l))}${f.req ? ' <span class="req">*</span>' : ''}</label>${f.area
        ? `<textarea name="${f.k}" placeholder="${esc(f.ph || '')}">${esc(row?.[f.k] || '')}</textarea>`
        : `<input name="${f.k}" placeholder="${esc(f.ph || '')}" value="${esc(row?.[f.k] || '')}" autocomplete="off">`}</div>`).join('')}
      <div class="field"><label>${esc(t('photos'))}</label>
        <div class="imgmgr" id="imgmgr"></div>
        <div class="row-btns"><button type="button" class="btn sm" data-pick="gallery">${ic('image')}${esc(t('gallery'))}</button><button type="button" class="btn sm" data-pick="camera">${ic('camera')}${esc(t('camera'))}</button></div>
      </div>
    </div>
    <div class="modal-foot"><span class="progress muted small" id="prog"></span><button type="button" class="btn ghost" data-close>${esc(t('cancel'))}</button><button type="submit" class="btn primary" id="btnSave">${esc(t('save'))}</button></div>
  </form></div>`, () => st.files.forEach(f => URL.revokeObjectURL(f.url)));

  const form = $('#frm');
  const drawImgs = () => {
    $('#imgmgr').innerHTML =
      st.kept.map((im, i) => `<div class="imi"><img src="${esc(imgUrl(im.path))}" alt=""><button type="button" data-rm-kept="${i}">${ic('x')}</button></div>`).join('') +
      st.files.map((f, i) => `<div class="imi new"><img src="${f.url}" alt=""><button type="button" data-rm-new="${i}">${ic('x')}</button></div>`).join('');
  };
  drawImgs();
  form.addEventListener('click', async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-close')) return closeModal();
    if (b.dataset.pick) {
      const files = await pickFiles(b.dataset.pick === 'camera');
      files.forEach(file => st.files.push({ file, url: URL.createObjectURL(file) }));
      drawImgs();
    } else if (b.dataset.rmKept !== undefined) {
      st.removed.push(...st.kept.splice(+b.dataset.rmKept, 1)); drawImgs();
    } else if (b.dataset.rmNew !== undefined) {
      const [f] = st.files.splice(+b.dataset.rmNew, 1); URL.revokeObjectURL(f.url); drawImgs();
    }
  });
  setTimeout(() => form.querySelector(isNew ? 'input' : 'textarea, input')?.focus(), 50);

  form.onsubmit = async e => {
    e.preventDefault();
    const vals = {};
    for (const f of fields) {
      const v = form.elements[f.k].value.trim();
      if (f.req && !v) { toast(t('required', { f: t(f.l) }), 'error'); form.elements[f.k].focus(); return; }
      vals[f.k] = v || null;
    }
    const btn = $('#btnSave'), prog = $('#prog');
    btn.disabled = true; prog.textContent = t('saving');
    const id = row?.id || uuid();
    let uploaded = [];
    try {
      uploaded = await uploadFiles(table, id, st.files.map(f => f.file), (i, n) => prog.textContent = t('uploading', { i, n }));
      prog.textContent = t('saving');
      const now = new Date().toISOString();
      const images = [...st.kept, ...uploaded];
      let res;
      if (isNew) {
        const payload = { id, ...vals, images, created_at: now, updated_at: now };
        if (table === 'programs') payload.machine_id = ctx.machine_id;
        if (table === 'entries') { payload.kind = kind; payload.machine_id = ctx.machine_id; payload.program_id = ctx.program_id || null; }
        res = await sb.from(table).insert(payload).select().single();
      } else {
        res = await sb.from(table).update({ ...vals, images, updated_at: now }).eq('id', id).select().single();
      }
      if (res.error) throw res.error;
      replaceLocal(table, res.data);
      if (st.removed.length) removePaths(st.removed.map(x => x.path));
      closeModal();
      if (isNew && table === 'machines') location.hash = `/m/${id}`;
      else if (isNew && table === 'programs') location.hash = `/p/${id}`;
      else { if (table === 'entries') S.open.add(id); render({ keepScroll: true }); }
      toast(t('saved'));
    } catch (err) {
      removePaths(uploaded.map(x => x.path));
      toast(t('error', { msg: err.message }), 'error');
      btn.disabled = false; prog.textContent = '';
    }
  };
}

/* ---------------- Lightbox ---------------- */
const LB = { table: null, id: null, i: 0 };
function openLightbox(table, id, i) { LB.table = table; LB.id = id; LB.i = i; renderLB(); }
function closeLB() { $('#lb')?.remove(); if (!$('#modal-root').innerHTML) document.body.classList.remove('lock'); }
function renderLB() {
  const row = getRow(LB.table, LB.id); const imgs = row?.images || [];
  if (!imgs.length) return closeLB();
  LB.i = Math.max(0, Math.min(LB.i, imgs.length - 1));
  let el = $('#lb');
  if (!el) {
    el = document.createElement('div'); el.id = 'lb'; el.className = 'lb';
    document.body.appendChild(el); document.body.classList.add('lock');
    let sx = null;
    el.addEventListener('touchstart', e => { sx = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
    el.addEventListener('touchend', e => {
      if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; sx = null;
      if (Math.abs(dx) > 50) { LB.i += dx < 0 ? 1 : -1; renderLB(); }
    });
    el.addEventListener('click', e => {
      const b = e.target.closest('[data-lb]');
      if (!b) { if (e.target.classList.contains('lb-stage')) closeLB(); return; }
      const a = b.dataset.lb;
      if (a === 'close') closeLB();
      else if (a === 'prev') { LB.i--; renderLB(); }
      else if (a === 'next') { LB.i++; renderLB(); }
      else if (a === 'del') deletePhoto(LB.table, LB.id, LB.i);
    });
  }
  const url = imgUrl(imgs[LB.i].path);
  el.innerHTML = `<div class="lb-top"><span>${LB.i + 1} / ${imgs.length}</span><div class="actions">
      <a class="icon-btn" href="${esc(url)}" target="_blank" rel="noopener" title="${esc(t('open'))}">${ic('link')}</a>
      <button class="icon-btn" data-lb="del" title="${esc(t('delete'))}">${ic('trash')}</button>
      <button class="icon-btn" data-lb="close" title="${esc(t('close'))}">${ic('x')}</button></div></div>
    <div class="lb-stage">${imgs.length > 1 ? `<button class="lb-nav lb-prev" data-lb="prev">${ic('left')}</button>` : ''}
      <img src="${esc(url)}" alt="">
      ${imgs.length > 1 ? `<button class="lb-nav lb-next" data-lb="next">${ic('chevron')}</button>` : ''}</div>`;
}

/* ---------------- Pencarian global ---------------- */
function buildIndex() {
  const mName = id => S.machines.find(m => m.id === id)?.name || '';
  const pRow = id => S.programs.find(p => p.id === id);
  const items = [];
  for (const m of S.machines) items.push({
    type: 'machine', group: 'machine', title: m.name, crumb: [m.model, m.location].filter(Boolean).join(' · '),
    own: [m.name, m.model, m.location, m.description].join(' '), body: m.description || '', ctx: '', img: m.images[0], go: `/m/${m.id}`
  });
  for (const p of S.programs) items.push({
    type: 'program', group: 'program', title: progLabel(p), crumb: mName(p.machine_id),
    own: [p.number, p.name, p.description].join(' '), body: p.description || '', ctx: mName(p.machine_id), img: p.images[0], go: `/p/${p.id}`
  });
  for (const e of S.entries) {
    const p = e.program_id ? pRow(e.program_id) : null;
    const crumb = [mName(e.machine_id), p ? progLabel(p) : ''].filter(Boolean).join(' › ');
    const go = e.kind === 'alarm' ? `/m/${e.machine_id}?tab=alarms&open=${e.id}`
      : e.kind === 'machine_note' ? `/m/${e.machine_id}?tab=notes&open=${e.id}`
      : e.kind === 'pallet' ? `/p/${e.program_id}?tab=pallets&open=${e.id}`
      : `/p/${e.program_id}?tab=notes&open=${e.id}`;
    items.push({
      type: e.kind, group: e.kind.endsWith('note') ? 'note' : e.kind,
      title: [e.code, e.title].filter(Boolean).join(' — '), crumb, own: [e.code, e.title, e.content].join(' '),
      body: e.content || '', ctx: crumb, img: e.images[0], go
    });
  }
  return items;
}
function search(q) {
  const terms = norm(q).split(/\s+/).filter(Boolean);
  if (!terms.length) return { terms, res: [] };
  const res = [];
  for (const it of buildIndex()) {
    const own = norm(it.own), full = own + ' ' + norm(it.ctx), title = norm(it.title);
    if (!terms.every(tm => full.includes(tm))) continue;
    if (!terms.some(tm => own.includes(tm))) continue;
    let score = 0;
    for (const tm of terms) { if (title.includes(tm)) score += 3; if (title.startsWith(tm)) score += 2; if (own.includes(tm)) score += 1; }
    if (it.type === 'machine') score += 1;
    res.push({ ...it, score });
  }
  res.sort((a, b) => b.score - a.score || natSort(a.title, b.title));
  return { terms, res };
}
function hl(text, terms) {
  text = String(text ?? '');
  if (!terms.length) return esc(text);
  const re = new RegExp(terms.map(escRe).join('|'), 'gi');
  let out = '', last = 0, m;
  while ((m = re.exec(text))) {
    if (!m[0]) { re.lastIndex++; continue; }
    out += esc(text.slice(last, m.index)) + '<mark>' + esc(m[0]) + '</mark>';
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}
function snippetOf(text, terms, len = 150) {
  text = String(text || '').replace(/\s+/g, ' ').trim();
  const low = text.toLowerCase(); let idx = -1;
  for (const tm of terms) { const i = low.indexOf(tm); if (i >= 0 && (idx < 0 || i < idx)) idx = i; }
  if (idx < 0) return text.slice(0, len) + (text.length > len ? '…' : '');
  const start = Math.max(0, idx - 40);
  return (start > 0 ? '…' : '') + text.slice(start, start + len) + (start + len < text.length ? '…' : '');
}

const byCode = (a, b) => natSort(a.code || '~', b.code || '~') || natSort(a.title, b.title);
const byUpdated = (a, b) => new Date(b.updated_at || b.created_at) - new Date(a.updated_at || a.created_at);

function viewMachine(id, params) {
  const m = S.machines.find(x => x.id === id);
  if (!m) return emptyBox(t('notFound'), 'search');
  const tab = params.get('tab') || 'programs';
  const progs = S.programs.filter(p => p.machine_id === id).sort((a, b) => natSort(a.number || '~', b.number || '~') || natSort(a.name, b.name));
  const alarms = S.entries.filter(e => e.machine_id === id && e.kind === 'alarm').sort(byCode);
  const notes = S.entries.filter(e => e.machine_id === id && e.kind === 'machine_note').sort(byUpdated);
  let body = '';
  if (tab === 'programs') {
    body = `<div class="toolbar"><span class="muted small">${progs.length} ${esc(t('programs'))}</span>
      <button class="btn primary sm" data-act="add" data-kind="program" data-mid="${id}">${ic('plus')}${esc(t('addFmt', { x: t('type_program') }))}</button></div>
      ${progs.length ? `<div class="list">${progs.map(p => {
        const pal = S.entries.filter(e => e.program_id === p.id && e.kind === 'pallet').length;
        const pn = S.entries.filter(e => e.program_id === p.id && e.kind === 'program_note').length;
        return `<a class="row" href="#/p/${p.id}"><div class="thumb">${p.images[0] ? `<img loading="lazy" src="${esc(imgUrl(p.images[0].path))}" alt="">` : ic('program')}</div>
          <div class="row-main"><div class="row-title">${p.number ? `<span class="code prog-code">${esc(p.number)}</span>` : ''}${esc(p.name)}</div>
          ${p.description ? `<div class="muted small clamp">${esc(p.description)}</div>` : ''}
          <div class="stats"><span>${ic('pallet')}${pal}</span><span>${ic('note')}${pn}</span><span>${ic('image')}${p.images.length}</span></div></div>${ic('chevron')}</a>`;
      }).join('')}</div>` : emptyBox(t('empty'), 'program')}`;
  } else if (tab === 'alarms') body = entrySection('alarm', alarms, id);
  else if (tab === 'notes') body = entrySection('machine_note', notes, id);
  else body = photoSection('machines', m);
  return `<nav class="crumbs"><a href="#/">${esc(t('machines'))}</a>›<span>${esc(m.name)}</span></nav>
    <section class="hero"><div class="hero-main"><div class="eyebrow">${esc(t('type_machine'))}</div><h1>${esc(m.name)}</h1>
      ${m.model || m.location ? `<div class="meta">${m.model ? `<span class="chip">${ic('machine')}${esc(m.model)}</span>` : ''}${m.location ? `<span class="chip">${ic('pin')}${esc(m.location)}</span>` : ''}</div>` : ''}
      ${m.description ? `<p class="desc">${esc(m.description)}</p>` : ''}</div>${heroActions('machine', m)}</section>
    ${tabsNav([['programs', t('programs'), progs.length], ['alarms', t('alarms'), alarms.length], ['notes', t('notes'), notes.length], ['photos', t('photos'), m.images.length]], tab)}

}

function viewProgram(id, params) {
  const p = S.programs.find(x => x.id === id);

  const m = S.machines.find(x => x.id === p.machine_id);
  const tab = params.get('tab') || 'pallets';
  const pallets = S.entries.filter(e => e.program_id === id && e.kind === 'pallet').sort(byCode);

    : tab === 'notes' ? entrySection('program_note', notes, p.machine_id, id)

    <section class="hero"><div class="hero-main"><div class="eyebrow">${esc(t('type_program'))}</div>
      <h1>${p.number ? `<span class="code prog-code" style="font-size:.7em;vertical-align:middle">${esc(p.number)}</span> ` : ''}${esc(p.name)}</h1>
      <div class="meta"><a class="chip" href="#/m/${p.machine_id}?tab=programs">${ic('machine')}${esc(m?.name || '')}</a></div>
      ${p.description ? `<p class="desc">${esc(p.description)}</p>` : ''}</div>${heroActions('program', p)}</section>
    ${tabsNav([['pallets', t('pallets'), pallets.length], ['notes', t('notes'), notes.length], ['photos', t('photos'), p.images.length]], tab)}
    ${body}`;
}

function viewSearch(params) {
  const q = params.get('q') || '';
  if (!q.trim()) return emptyBox(t('searchHint'), 'search');
  const { terms, res } = search(q);
  const groups = [['all', t('all')], ['machine', t('type_machine')], ['program', t('type_program')], ['alarm', t('type_alarm')], ['pallet', t('type_pallet')], ['note', t('type_note')]];
  const counts = { all: res.length };
  res.forEach(r => counts[r.group] = (counts[r.group] || 0) + 1);
  if (S.searchType !== 'all' && !counts[S.searchType]) S.searchType = 'all';
  const shown = (S.searchType === 'all' ? res : res.filter(r => r.group === S.searchType)).slice(0, 300);
  if (!res.length) return emptyBox(t('noResults', { q }), 'search');
  return `<div class="muted small" style="margin-bottom:8px">${esc(t('results', { n: res.length }))}</div>
    <div class="chips">${groups.filter(([k]) => counts[k]).map(([k, l]) => `<button class="fchip ${S.searchType === k ? 'on' : ''}" data-act="stype" data-v="${k}">${esc(l)} ${counts[k]}</button>`).join('')}</div>
    <div class="list">${shown.map(r => `<a class="result" href="#${r.go}"><span class="badge b-${r.group}">${esc(t('type_' + r.type))}</span>
      <div class="r-main"><div class="r-title">${hl(r.title, terms)}</div>${r.crumb ? `<div class="crumb">${hl(r.crumb, terms)}</div>` : ''}
      ${r.body ? `<div class="r-snip clamp">${hl(snippetOf(r.body, terms), terms)}</div>` : ''}</div>
      ${r.img ? `<div class="thumb"><img loading="lazy" src="${esc(imgUrl(r.img.path))}" alt=""></div>` : ''}</a>`).join('')}</div>`;
}

/* ---------------- Shell & routing ---------------- */
function parseRoute() {
  const h = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = h.split('?');
  return { parts: path.split('/').filter(Boolean), params: new URLSearchParams(qs || '') };
}
function renderShell(keep) {
  const { parts, params } = parseRoute();
  const qv = parts[0] === 'search' ? (params.get('q') || '') : '';
  $('#app').innerHTML = `<header class="topbar">
    <div class="bar"><button class="icon-btn" id="btnBack" data-act="back" aria-label="${esc(t('back'))}">${ic('back')}</button>
      <a href="#/" class="brand"><img class="brand-logo" src="icons/icon.svg" alt=""><span>${esc(t('appName'))}</span></a><div class="spacer"></div>
      ${installBtn()}${langSeg()}${themeBtn()}<button class="icon-btn" data-act="menu" aria-label="${esc(t('menu'))}">${ic('menu')}</button></div>
    <div class="searchrow"><label class="searchbox">${ic('search')}<input id="q" type="search" enterkeyhint="search" autocomplete="off" placeholder="${esc(t('search'))}" value="${esc(qv)}">
      <button class="icon-btn" id="qClear" type="button" aria-label="${esc(t('close'))}" ${qv ? '' : 'hidden'}>${ic('x')}</button></label></div>
  </header><main id="main"></main>`;
  const q = $('#q');
  let deb;
  q.addEventListener('input', () => {
    $('#qClear').hidden = !q.value;
    clearTimeout(deb);
    deb = setTimeout(() => {
      const target = '#/search?q=' + encodeURIComponent(q.value);
      if (parseRoute().parts[0] === 'search') { history.replaceState(null, '', target); render({ keepScroll: true }); }
      else if (q.value.trim()) location.hash = target.slice(1);
    }, 150);
  });
  q.addEventListener('keydown', e => { if (e.key === 'Escape') clearSearch(); if (e.key === 'Enter') q.blur(); });
  $('#qClear').addEventListener('click', e => { e.preventDefault(); clearSearch(); });
  render({ keepScroll: keep });
}
function clearSearch() {
  const q = $('#q'); if (!q) return;
  q.value = ''; $('#qClear').hidden = true;
  if (parseRoute().parts[0] === 'search') { if (history.length > 1) history.back(); else location.hash = '/'; }
}
function render(opts = {}) {
  const main = $('#main'); if (!main) return;
  const { parts, params } = parseRoute();
  $('#btnBack').hidden = !parts.length;
  const openId = !opts.keepScroll ? params.get('open') : null;
  if (openId) S.open.add(openId);
  let html;
  if (S.loadError) html = `<div class="empty">${ic('db', 'big')}<p>${esc(t('loadFail'))}</p><p class="small">${esc(S.loadError)}</p><p><button class="btn" data-act="refresh">${ic('refresh')}${esc(t('retry'))}</button></p></div>`;
  else if (!S.loaded) html = `<div class="loading"><div class="spinner"></div>${esc(t('loading'))}</div>`;
  else if (parts[0] === 'm') html = viewMachine(parts[1], params);
  else if (parts[0] === 'p') html = viewProgram(parts[1], params);
  else if (parts[0] === 'search') html = viewSearch(params);
  else html = viewHome();
  main.innerHTML = html;
  const q = $('#q');
  if (q && document.activeElement !== q) { q.value = parts[0] === 'search' ? (params.get('q') || '') : ''; $('#qClear').hidden = !q.value; }
  if (openId) {
    const el = document.getElementById('e-' + openId);
    if (el) { el.scrollIntoView({ block: 'start' }); el.classList.add('flash'); }
  } else if (!opts.keepScroll) window.scrollTo(0, 0);
}

/* ---------------- Event global ---------------- */
document.addEventListener('click', e => {
  const ov = e.target.closest('[data-overlay]');
  if (ov && e.target === ov) return closeModal();
  if (e.target.closest('#modal-root [data-close]') && !e.target.closest('#frm')) return closeModal();
  const el = e.target.closest('[data-act]'); if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case 'lang': setLang(d.v); break;
    case 'theme': closeModal(); toggleTheme(); break;
    case 'menu': openMenu(); break;
    case 'back': if (history.length > 1) history.back(); else location.hash = '/'; break;
    case 'add': openForm(d.kind, null, { machine_id: d.mid || null, program_id: d.pid || null }); break;
    case 'edit': { const r = getRow(kindTable(d.kind), d.id); if (r) openForm(d.kind, r); break; }
    case 'del': deleteRecord(d.table, d.id); break;
    case 'toggle-entry': S.open.has(d.id) ? S.open.delete(d.id) : S.open.add(d.id); render({ keepScroll: true }); break;
    case 'add-photos': quickAddPhotos(d.table, d.id, d.src === 'camera'); break;
    case 'lightbox': openLightbox(d.table, d.id, +d.i); break;
    case 'tab': { const { parts } = parseRoute(); history.replaceState(null, '', `#/${parts[0]}/${parts[1]}?tab=${d.tab}`); render({ keepScroll: true }); break; }
    case 'stype': S.searchType = d.v; render({ keepScroll: true }); break;
    case 'refresh': closeModal(); loadAll(); break;
    case 'logout': closeModal(); sb.auth.signOut(); break;
    case 'reset-config': resetConfig(); break;
    case 'install': closeModal(); doInstall(); break;
    case 'reload-app': location.reload(); break;
  }
});
document.addEventListener('keydown', e => {
  if ($('#lb')) {
    if (e.key === 'Escape') closeLB();
    else if (e.key === 'ArrowLeft') { LB.i--; renderLB(); }
    else if (e.key === 'ArrowRight') { LB.i++; renderLB(); }
  } else if (e.key === 'Escape' && $('#modal-root').innerHTML) closeModal();
});
window.addEventListener('hashchange', () => { if (screen === 'app') { closeLB(); render(); } });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!LS.get('mct_theme', null)) { applyTheme(); rerender(); } });

/* ---------------- PWA: install & service worker ---------------- */
let installEvt = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const canShowInstall = () => !isStandalone() && (!!installEvt || isIOS());
const installBtn = () => canShowInstall() ? `<button class="icon-btn install-btn" data-act="install" title="${esc(t('install'))}" aria-label="${esc(t('install'))}">${ic('download')}</button>` : '';
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; rerender(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast(t('installed')); rerender(); });
async function doInstall() {
  if (installEvt) {
    const ev = installEvt;
    ev.prompt();
    try { await ev.userChoice; } catch {}
    installEvt = null; rerender();
    return;
  }
  const steps = isIOS()
    ? `<ol class="ios-steps"><li>${t('iosStep1', { icon: ic('share') })}</li><li>${esc(t('iosStep2'))}</li><li>${esc(t('iosStep3'))}</li></ol>`
    : `<p style="margin:0">${esc(t('manualInstall'))}</p>`;
  showModal(`<div class="overlay" data-overlay><div class="modal sm">
    <div class="modal-head"><h2>${esc(t('installTitle'))}</h2><button type="button" class="icon-btn" data-close>${ic('x')}</button></div>
    <div class="modal-body"><div class="install-hero"><img src="icons/icon-192.png" alt=""><div><b>${esc(t('appName'))}</b><div class="muted small">${esc(t('installDesc'))}</div></div></div>${steps}</div>
  </div></div>`);
}
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        nw && nw.addEventListener('statechange', () => {
          if (nw.state === 'activated' && navigator.serviceWorker.controller) toast(t('updateReady') + ' — ' + t('reload'), '', false);
        });
      });
    }).catch(err => console.warn('SW', err));
  });
}

boot();
</script>
